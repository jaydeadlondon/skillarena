<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SkillArena{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <main class="shell">
    <nav class="nav">
      <a class="brand" href="/">Skill<span>Arena</span></a>
      <div class="nav-links">
        {% if user %}
          <a href="/dashboard">Dashboard</a>
          <a href="/courses">Courses</a>
          <a href="/pvp">PvP Battles</a>
          <a href="/profile">Profile</a>
          {% if user.role.value == 'admin' %}<a href="/admin">Admin</a>{% endif %}
          <button class="btn" data-focus-toggle type="button">Focus Mode</button>
          <form method="post" action="/auth/logout"><button class="btn danger" type="submit">Log out</button></form>
        {% else %}
          <a class="btn primary" href="/auth/steam">Sign in with Steam</a>
          <a class="btn" href="/auth/steam/mock">Dev mock login</a>
        {% endif %}
      </div>
    </nav>
    {% block content %}{% endblock %}
  </main>
  <button class="focus-exit" data-focus-toggle type="button" aria-label="Exit Focus Mode">Exit Focus Mode</button>
  <script src="/static/js/app.js"></script>
