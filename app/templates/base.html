<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SkillArena{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body data-authenticated="{% if user %}true{% else %}false{% endif %}">
  <main class="shell">
    <nav class="nav">
      <a class="brand" href="{% if user %}/dashboard{% else %}/{% endif %}">Skill<span>Arena</span></a>
      <div class="nav-links">
        {% if user %}
          <a href="/dashboard">Dashboard</a>
          <a class="streak-pill" href="/streaks" title="Current learning streak">🔥 {{ user.current_streak_days }}</a>
          <a href="/courses">Courses</a>
          <a href="/quests">Quests</a>
          <a href="/focus">Focus</a>
          <a href="/pvp">PvP Battles</a>
          <a href="/shop">Shop</a>
          <a href="/profile">Profile</a>
          {% if user.role.value == 'admin' %}<a href="/admin">Admin</a>{% endif %}
          <form method="post" action="/auth/logout"><button class="btn danger" type="submit">Log out</button></form>
        {% else %}
          <a class="btn primary" href="/auth/steam">Log in with Steam</a>
          <a class="btn" href="/auth/steam/mock">Dev mock login</a>
        {% endif %}
      </div>
    </nav>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/js/app.js"></script>
</body>
</html>
