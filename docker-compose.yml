services:
  web:
    build: .
    container_name: skillarena-web
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /app
    environment:
      PYTHONPATH: /app
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  db:
    image: postgres:16-alpine
    container_name: skillarena-db
    environment:
      POSTGRES_DB: skillarena
      POSTGRES_USER: skillarena
      POSTGRES_PASSWORD: skillarena
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillarena -d skillarena"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
