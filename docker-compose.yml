services:
  web:
    build: .
    container_name: skillarena-web
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: skillarena-db
    environment:
      POSTGRES_DB: skillarena
      POSTGRES_USER: skillarena
      POSTGRES_PASSWORD: skillarena
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillarena -d skillarena"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
